<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tigo PJC - Simulador de Combo</title>
<style>
:root{
  --tigo-blue:#004aad;
  --tigo-yellow:#ffc900;
  --tigo-green:#25d366;
}
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#0a0a0a;}
header{background:var(--tigo-blue);color:white;padding:15px;display:flex;align-items:center;gap:15px;}
header img{height:50px;}
header h1{font-size:20px;margin:0;}
main{padding:10px;max-width:700px;margin:auto;}
h2{color:var(--tigo-blue);}
label{display:block;margin-top:10px;}
select, button{
  padding:8px;margin-top:5px;width:100%;border-radius:4px;border:1px solid #ccc;font-size:16px;
}
button{cursor:pointer;font-weight:bold;}
button:hover{opacity:0.9;}
#whatsappBtn{background-color:var(--tigo-green);color:white;border:none;padding:10px;font-weight:bold;border-radius:5px;margin-top:10px;}
.hidden{display:none;}
.resumen{background:white;padding:15px;border-radius:8px;margin-top:20px;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
.resumen ul{list-style:none;padding:0;}
.resumen li{margin-bottom:5px;font-weight:bold;}
</style>
</head>
<body>

<header>
  <img src="images/logo-tigo.png" alt="Tigo Logo">
  <h1>Tigo PJC - Internet y TV</h1>
</header>

<main>
  <!-- Selección de zona -->
  <section>
    <h2>Selecciona tu zona</h2>
    <label for="zonaSelect">Zona:</label>
    <select id="zonaSelect">
      <option value="urbana">Urbana</option>
      <option value="rural">Rural</option>
    </select>
  </section>

  <!-- Modalidades -->
  <section id="modalidades" class="hidden">
    <h2>Elige tus servicios</h2>

    <!-- TV Satelital -->
    <div id="tvSatelitalDiv" class="modalidad hidden">
      <label for="tvSatelital">TV Satelital:</label>
      <select id="tvSatelital">
        <option value="">-- Selecciona --</option>
        <option value="TV Satelital Inicial">Inicial - 46 canales - 99.000 Gs</option>
        <option value="TV Satelital Familiar">Familiar - 73 canales - 139.000 Gs</option>
      </select>
    </div>

    <!-- TV Cable -->
    <div id="tvCableDiv" class="modalidad hidden">
      <label for="tvCable">TV Cable:</label>
      <select id="tvCable">
        <option value="">-- Selecciona --</option>
        <option value="TV Cable Inicial">Inicial - 119.000 Gs</option>
        <option value="TV Cable Familiar">Familiar - 139.000 Gs</option>
      </select>
    </div>

    <!-- WiFi -->
    <div id="wifiDiv" class="modalidad hidden">
      <label for="wifi">Internet WiFi:</label>
      <select id="wifi">
        <option value="">-- Selecciona --</option>
        <option value="WiFi 100 Mbps">100 Mbps - 120.000 Gs</option>
        <option value="WiFi 200 Mbps">200 Mbps - 180.000 Gs</option>
        <option value="WiFi 300 Mbps">300 Mbps - 215.000 Gs</option>
      </select>
    </div>

    <!-- Combos -->
    <div id="comboDiv" class="modalidad hidden">
      <label for="combo">Combos:</label>
      <select id="combo">
        <option value="">-- Selecciona --</option>
        <option value="Combo 100 Mbps + TV Inicial">100 Mbps + TV Inicial - 180.000 Gs</option>
        <option value="Combo 200 Mbps + TV Familiar + Disney">200 Mbps + TV Familiar + Disney - 215.000 Gs</option>
      </select>
    </div>

    <!-- Oferta Especial -->
    <div id="ofertaDiv" class="modalidad hidden">
      <label for="oferta">Oferta Especial:</label>
      <select id="oferta">
        <option value="">-- Selecciona --</option>
        <option value="Oferta Especial WiFi 120.000">WiFi ilimitado - 120.000 Gs</option>
      </select>
    </div>

  </section>

  <!-- Resumen -->
  <section class="resumen">
    <h2>Resumen</h2>
    <ul id="resumenList"></ul>
    <button id="whatsappBtn">Enviar a WhatsApp</button>
  </section>
</main>

<script>
const zonaSelect = document.getElementById("zonaSelect");
const modalidades = {
  tvSatelital: document.getElementById("tvSatelitalDiv"),
  tvCable: document.getElementById("tvCableDiv"),
  wifi: document.getElementById("wifiDiv"),
  combo: document.getElementById("comboDiv"),
  oferta: document.getElementById("ofertaDiv")
};
const selects = {
  tvSatelital: document.getElementById("tvSatelital"),
  tvCable: document.getElementById("tvCable"),
  wifi: document.getElementById("wifi"),
  combo: document.getElementById("combo"),
  oferta: document.getElementById("oferta")
};
const resumenList = document.getElementById("resumenList");
const whatsappBtn = document.getElementById("whatsappBtn");

// Mostrar modalidades según zona
function updateZona(){
  document.getElementById("modalidades").classList.remove("hidden");
  if(zonaSelect.value==="rural"){
    modalidades.tvSatelital.classList.remove("hidden");
    modalidades.tvCable.classList.add("hidden");
    modalidades.wifi.classList.add("hidden");
    modalidades.combo.classList.add("hidden");
    modalidades.oferta.classList.add("hidden");
  } else {
    for(let key in modalidades){
      modalidades[key].classList.remove("hidden");
    }
  }
  // Reset selects
  for(let key in selects) selects[key].value="";
  updateResumen();
}
zonaSelect.addEventListener("change", updateZona);

// Actualizar resumen
function updateResumen(){
  resumenList.innerHTML="";
  for(let key in selects){
    if(selects[key].value!==""){
      const li = document.createElement("li");
      li.textContent = selects[key].value;
      resumenList.appendChild(li);
    }
  }
}

// Cada select actualiza resumen
for(let key in selects){
  selects[key].addEventListener("change", updateResumen);
}

// WhatsApp
whatsappBtn.addEventListener("click",()=>{
  let msg = "Hola, quiero contratar:\n";
  let anySelected=false;
  for(let key in selects){
    if(selects[key].value!==""){
      msg+="- "+selects[key].value+"\n";
      anySelected=true;
    }
  }
  if(!anySelected){alert("Selecciona al menos un servicio"); return;}
  window.open("https://wa.me/595984049651?text="+encodeURIComponent(msg),"_blank");
});

// Inicial
updateZona();
</script>
</body>
</html>
