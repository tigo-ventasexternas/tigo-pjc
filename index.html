<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tigo PJC - Simulador</title>
<style>
body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
header { background-color: #002e5d; color: #fff; padding: 10px 20px; display: flex; align-items: center; }
header img { height: 50px; margin-right: 15px; }
.container { max-width: 800px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
h2 { color: #002e5d; }
select, button { padding: 10px; font-size: 16px; margin: 10px 0; width: 100%; }
button { background-color: #00b14f; color: #fff; border: none; cursor: pointer; border-radius: 5px; }
button:hover { opacity: 0.9; }
#resumen { margin-top: 20px; padding: 15px; background: #e6f7ff; border-radius: 5px; border: 1px solid #91d5ff; }
img.service-img { width: 100px; display: block; margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <img src="images/logo-tigo.png" alt="Tigo Logo">
  <h1>Tigo PJC - Simulador de Combo</h1>
</header>

<div class="container">
  <h2>1. Selecciona tu zona</h2>
  <select id="zona">
    <option value="">-- Selecciona --</option>
    <option value="urbana">Urbana</option>
    <option value="rural">Rural</option>
  </select>

  <div id="servicio-container" style="display:none;">
    <h2>2. Elige tu servicio</h2>
    <select id="servicio">
      <option value="">-- Selecciona --</option>
    </select>
  </div>

  <div id="resumen" style="display:none;">
    <h2>Resumen de tu selección</h2>
    <p id="resumen-text"></p>
    <a id="whatsapp-link" href="#" target="_blank">
      <button>Contactar por WhatsApp</button>
    </a>
  </div>
</div>

<script>
const serviciosData = {
  rural: [
    { nombre: "TV Satelital Inicial", costo: "99.000", descripcion: "46 canales", img: "images/antena-satelital.png" },
    { nombre: "TV Satelital Familiar", costo: "139.000", descripcion: "73 canales", img: "images/antena-satelital.png" }
  ],
  urbana: [
    { nombre: "WiFi 100 Mbps", costo: "120.000", descripcion: "Internet Ilimitado", img: "images/combo-popular.png" },
    { nombre: "WiFi 200 Mbps + TV Inicial", costo: "180.000", descripcion: "Internet + TV Inicial", img: "images/combo-popular.png" },
    { nombre: "WiFi 200 Mbps + TV Familiar + Disney", costo: "215.000", descripcion: "Internet + TV Familiar + Disney", img: "images/combo-popular.png" },
    { nombre: "TV Cable Inicial", costo: "119.000", descripcion: "Canales Básicos", img: "images/combo-popular.png" },
    { nombre: "TV Cable Familiar", costo: "139.000", descripcion: "Canales Familiares", img: "images/combo-popular.png" }
  ]
};

const zonaSelect = document.getElementById("zona");
const servicioContainer = document.getElementById("servicio-container");
const servicioSelect = document.getElementById("servicio");
const resumenDiv = document.getElementById("resumen");
const resumenText = document.getElementById("resumen-text");
const whatsappLink = document.getElementById("whatsapp-link");

zonaSelect.addEventListener("change", () => {
  const zona = zonaSelect.value;
  servicioSelect.innerHTML = '<option value="">-- Selecciona --</option>';
  resumenDiv.style.display = "none";

  if(zona && serviciosData[zona]) {
    serviciosData[zona].forEach((s, index) => {
      const option = document.createElement("option");
      option.value = index;
      option.text = `${s.nombre} - Gs. ${s.costo} (${s.descripcion})`;
      servicioSelect.add(option);
    });
    servicioContainer.style.display = "block";
  } else {
    servicioContainer.style.display = "none";
  }
});

servicioSelect.addEventListener("change", () => {
  const zona = zonaSelect.value;
  const servicioIndex = servicioSelect.value;
  if(servicioIndex !== "") {
    const s = serviciosData[zona][servicioIndex];
    resumenText.innerHTML = `<strong>${s.nombre}</strong><br>Costo: Gs. ${s.costo}<br>Detalle: ${s.descripcion}`;
    whatsappLink.href = `https://wa.me/595984049651?text=Hola%20Isidro,%20quiero%20informacion%20sobre%20el%20servicio%20${encodeURIComponent(s.nombre)}`;
    resumenDiv.style.display = "block";
  } else {
    resumenDiv.style.display = "none";
  }
});
</script>
</body>
</html>
