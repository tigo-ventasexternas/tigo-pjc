<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tigo PJC - Simulador de Combo</title>
<style>
:root{
  --tigo-blue:#004aad;
  --tigo-yellow:#ffc900;
}
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f5f5f5;
  color:#0a0a0a;
}
header{
  background: var(--tigo-blue);
  color:white;
  padding: 15px;
  display:flex;
  align-items:center;
  gap:15px;
}
header img{height:50px;}
header h1{font-size:20px;margin:0;}
main{padding:10px; max-width:700px; margin:auto;}
h2{color:var(--tigo-blue);}
label{display:block; margin-top:10px;}
select, button{
  padding:8px;
  margin-top:5px;
  width:100%;
  border-radius:4px;
  border:1px solid #ccc;
  font-size:16px;
}
button{
  background-color: var(--tigo-yellow);
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.resumen{
  background:white;
  padding:15px;
  border-radius:8px;
  margin-top:20px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
.resumen ul{list-style:none; padding:0;}
.resumen li{margin-bottom:5px;font-weight:bold;}
.hidden{display:none;}
</style>
</head>
<body>

<header>
  <img src="images/logo-tigo.png" alt="Tigo Logo">
  <h1>Tigo PJC - Internet y TV</h1>
</header>

<main>
  <!-- Selección de zona -->
  <section>
    <h2>Selecciona tu zona</h2>
    <label for="zonaSelect">Zona:</label>
    <select id="zonaSelect">
      <option value="urbana">Urbana</option>
      <option value="rural">Rural</option>
    </select>
  </section>

  <!-- Modalidades -->
  <section id="modalidades">
    <h2>Elige tus servicios</h2>

    <div id="tvSatelitalDiv" class="modalidad">
      <label for="tvSatelital">TV Satelital:</label>
      <select id="tvSatelital">
        <option value="">-- Selecciona --</option>
        <option value="Inicial">Inicial - 46 canales - 99.000 Gs</option>
        <option value="Familiar">Familiar - 73 canales - 139.000 Gs</option>
      </select>
    </div>

    <div id="tvCableDiv" class="modalidad">
      <label for="tvCable">TV Cable:</label>
      <select id="tvCable">
        <option value="">-- Selecciona --</option>
        <option value="Inicial">Inicial - 119.000 Gs</option>
        <option value="Familiar">Familiar - 139.000 Gs</option>
      </select>
    </div>

    <div id="wifiDiv" class="modalidad">
      <label for="wifi">Internet WiFi:</label>
      <select id="wifi">
        <option value="">-- Selecciona --</option>
        <option value="100mb">100 Mbps - 120.000 Gs</option>
        <option value="200mb">200 Mbps - 180.000 Gs</option>
        <option value="300mb">300 Mbps - 215.000 Gs</option>
      </select>
    </div>

    <div id="combosDiv" class="modalidad">
      <label for="combo">Combos:</label>
      <select id="combo">
        <option value="">-- Selecciona --</option>
        <option value="combo1">100 Mbps + TV Inicial - 180.000 Gs</option>
        <option value="combo2">200 Mbps + TV Familiar + Disney - 215.000 Gs</option>
      </select>
    </div>

    <div id="ofertaDiv" class="modalidad">
      <label for="oferta">Oferta Especial:</label>
      <select id="oferta">
        <option value="">-- Selecciona --</option>
        <option value="oferta1">WiFi ilimitado 120.000 Gs</option>
      </select>
    </div>
  </section>

  <!-- Resumen -->
  <section class="resumen">
    <h2>Resumen</h2>
    <ul id="resumenList"></ul>
    <p>Total: <span id="totalCost">0</span> Gs.</p>
    <button id="whatsappBtn">Enviar a WhatsApp</button>
  </section>
</main>

<script>
const zonaSelect = document.getElementById("zonaSelect");
const tvSatelitalDiv = document.getElementById("tvSatelitalDiv");
const tvCableDiv = document.getElementById("tvCableDiv");
const wifiDiv = document.getElementById("wifiDiv");
const combosDiv = document.getElementById("combosDiv");
const ofertaDiv = document.getElementById("ofertaDiv");

const tvSatelital = document.getElementById("tvSatelital");
const tvCable = document.getElementById("tvCable");
const wifi = document.getElementById("wifi");
const combo = document.getElementById("combo");
const oferta = document.getElementById("oferta");

const resumenList = document.getElementById("resumenList");
const totalCost = document.getElementById("totalCost");
const whatsappBtn = document.getElementById("whatsappBtn");

// Mostrar/ocultar según zona
function updateZona(){
  if(zonaSelect.value==="rural"){
    tvSatelitalDiv.style.display="block";
    tvCableDiv.style.display="none";
    wifiDiv.style.display="none";
    combosDiv.style.display="none";
    ofertaDiv.style.display="none";
    tvCable.value="";
    wifi.value="";
    combo.value="";
    oferta.value="";
  } else {
    tvSatelitalDiv.style.display="block";
    tvCableDiv.style.display="block";
    wifiDiv.style.display="block";
    combosDiv.style.display="block";
    ofertaDiv.style.display="block";
  }
  updateResumen();
}

zonaSelect.addEventListener("change", updateZona);

// Actualizar resumen
function updateResumen(){
  let serviciosSeleccionados=[];
  let total=0;

  function agregar(select,id){
    if(select.value!==""){
      serviciosSeleccionados.push(select.value);
      // Extraer costo de texto (Gs) como número genérico
      let match = select.options[select.selectedIndex].text.match(/(\d+)\s*Gs/);
      if(match) total += parseInt(match[1]);
    }
  }

  agregar(tvSatelital,"tvSatelital");
  agregar(tvCable,"tvCable");
  agregar(wifi,"wifi");
  agregar(combo,"combo");
  agregar(oferta,"oferta");

  resumenList.innerHTML="";
  serviciosSeleccionados.forEach(s=>{
    let li=document.createElement("li");
    li.textContent=s;
    resumenList.appendChild(li);
  });
  totalCost.textContent=total.toLocaleString();
}

// Todos los selects actualizan resumen
[tvSatelital,tvCable,wifi,combo,oferta].forEach(s=>{
  s.addEventListener("change", updateResumen);
});

// WhatsApp
whatsappBtn.addEventListener("click",()=>{
  let serviciosSeleccionados=[];
  let total=0;
  [tvSatelital,tvCable,wifi,combo,oferta].forEach(s=>{
    if(s.value!==""){
      serviciosSeleccionados.push(s.value);
      let match = s.options[s.selectedIndex].text.match(/(\d+)\s*Gs/);
      if(match) total+=parseInt(match[1]);
    }
  });
  if(serviciosSeleccionados.length===0){alert("Selecciona al menos un servicio"); return;}
  let mensaje="Hola, quiero contratar:\n";
  serviciosSeleccionados.forEach(s=>{
    mensaje+="- "+s+"\n";
  });
  mensaje+="Total: Gs. "+total.toLocaleString();
  window.open("https://wa.me/595984049651?text="+encodeURIComponent(mensaje),"_blank");
});

// Inicial
updateZona();
</script>
