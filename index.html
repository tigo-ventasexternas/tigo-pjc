<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tigo PJC - Internet y TV</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      color: #0a0a0a;
    }
    header {
      background-color: #003399;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    header img {
      height: 40px;
    }
    header h1 {
      font-size: 20px;
      margin: 0;
    }
    .hero {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      gap: 20px;
    }
    .hero img {
      max-width: 200px;
      height: auto;
    }
    .combos {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
    }
    .combo-card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      width: 200px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .combo-card img {
      width: 100%;
      max-height: 120px;
      object-fit: contain;
    }
    .combo-card h3 {
      font-size: 18px;
      margin: 10px 0 5px;
    }
    .combo-card p {
      font-size: 16px;
      margin: 5px 0;
      color: #003399;
      font-weight: bold;
    }
    .combo-card button {
      background-color: #ffcc00;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    .simulador {
      background: white;
      margin: 20px auto;
      padding: 20px;
      max-width: 400px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .simulador select, .simulador button {
      padding: 10px;
      width: 80%;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
  </style>
</head>
<body>

<header>
  <img src="images/logo-tigo.png" alt="Logo Tigo">
  <h1>Tigo PJC - Internet y TV</h1>
</header>

<div class="hero">
  <img src="images/combo-popular.png" alt="Combo Popular">
  <img src="images/antena-satelital.png" alt="Antena Satelital">
</div>

<section class="combos">
  <div class="combo-card">
    <img src="images/combo-popular.png" alt="Internet 100 Mbps">
    <h3>Internet 100 Mbps</h3>
    <p>Gs. 120.000</p>
    <button onclick="alert('Seleccionaste Internet 100 Mbps')">Seleccionar / Simular</button>
  </div>

  <div class="combo-card">
    <img src="images/combo-popular.png" alt="TV Familiar">
    <h3>TV Familiar</h3>
    <p>Gs. 139.000</p>
    <button onclick="alert('Seleccionaste TV Familiar')">Seleccionar / Simular</button>
  </div>

  <div class="combo-card">
    <img src="images/combo-popular.png" alt="Internet + TV">
    <h3>Internet + TV</h3>
    <p>Gs. 180.000</p>
    <button onclick="alert('Seleccionaste Internet + TV')">Seleccionar / Simular</button>
  </div>
</section>

<section class="simulador">
  <h2>Simulador de Combo Avanzado</h2>
  <label for="zona">Zona:</label><br>
  <select id="zona">
    <option value="urbana">Urbana</option>
    <option value="rural">Rural</option>
  </select><br>
  <button onclick="alert('Zona seleccionada: ' + document.getElementById('zona').value)">Siguiente</button>
</section>

</body>
</html>
