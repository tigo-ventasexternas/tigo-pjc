<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tigo Hogar | Super Combo WiFi + Tigo TV</title>
  <link rel="icon" href="images/logo-tigo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: linear-gradient(to bottom, #0f2c5b, #004aad); color: #001a49; line-height:1.4; overflow:hidden; }

    .page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .container { width:90%; max-width:400px; background:white; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.15); text-align:center; padding:20px; overflow:hidden; }

    .logo img { max-width:80px; height:auto; margin-bottom:10px; }

    .perfil img { width:70px; height:70px; border-radius:50%; border:2px solid #004aad; background:white; margin-bottom:5px; }
    .perfil h3 { font-size:1.1rem; margin-bottom:2px; font-weight:bold; }
    .perfil .autorizacion { background:#e8f5e9; padding:3px 10px; border-radius:20px; font-size:0.7rem; color:#004aad; font-weight:bold; display:inline-block; margin-top:4px; }

    h1 { font-size:1.4rem; font-weight:700; margin-bottom:0.6rem; color:#001a49; line-height:1.4; }
    h1 span { color:#004aad; }
    .description { font-size:0.9rem; color:#333; margin-bottom:12px; line-height:1.5; }

    .cta-button, .submit-btn { display:inline-block; margin-top:12px; padding:12px 20px; border-radius:40px; font-weight:bold; font-size:0.95rem; text-decoration:none; cursor:pointer; transition:0.2s; }
    .cta-button { background:#004aad; color:white; }
    .cta-button:hover { background:#0060ff; }
    .submit-btn { background:#25D366; color:white; border:none; }
    .submit-btn:hover { background:#20b857; }

    form { display:flex; flex-direction:column; gap:10px; margin-top:12px; text-align:left; }
    input, textarea { padding:10px; border-radius:10px; border:1px solid #ccc; width:100%; font-size:0.85rem; }
    label { font-weight:bold; font-size:0.8rem; color:#004aad; }

    .footer-info { font-size:0.7rem; color:#555; margin-top:10px; text-align:center; }

    .page img.combo { width:100%; border-radius:12px; margin-bottom:15px; }

    @media (max-width: 480px) {
      h1 { font-size:1.2rem; }
      .description { font-size:0.85rem; }
      .logo img { max-width:60px; }
    }
  </style>
</head>
<body>

  <!-- Página 1: Persuasión -->
  <div class="page" id="page1">
    <div class="container">
      <div class="logo"><img src="images/logo-tigo.png" alt="Tigo"></div>
      <div class="perfil">
        <img src="images/perfil.png" alt="Isidro Cabrera">
        <h3>Isidro Cabrera</h3>
        <span class="autorizacion">Vendedor Externo Autorizado 102598</span>
      </div>
      <img src="images/combo-inicial-200mb-71canales.png" alt="Combo Internet + TV" class="combo">
      <h1>¡WiFi ilimitado + Tigo TV + Tigo Sports + Disney! 25% de descuento: solo Gs. 180.000</h1>
      <a href="#page2" class="cta-button">Quiero mi combo ahora por WhatsApp</a>
    </div>
  </div>

  <!-- Página 2: Captura de datos -->
  <div class="page" id="page2" style="display:none;">
    <div class="container">
      <h1>Completa tus datos</h1>
      <form onsubmit="return enviarWhatsApp();">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+" title="Solo letras y espacios" required>

        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" min="18" max="80" required>

        <label for="calle">Calle</label>
        <input type="text" id="calle" name="calle" pattern="[A-Za-z0-9 ]+" title="Solo letras, números y espacios" required>

        <label for="numero">Número</label>
        <input type="number" id="numero" name="numero" min="0" required>

        <label for="barrio">Barrio</label>
        <input type="text" id="barrio" name="barrio" pattern="[A-Za-z0-9 ]+" title="Solo letras, números y espacios" required>

        <label><input type="checkbox" id="ubicacion" name="ubicacion" required> Acepto enviar mi ubicación por WhatsApp para verificar disponibilidad de servicio</label>

        <button type="submit" class="submit-btn">Enviar mis datos por WhatsApp</button>
      </form>
      <p class="footer-info">Sin filas, sin papeleo. 100% online. Instalación rápida y soporte 24/7.</p>
    </div>
  </div>

  <script>
    document.querySelector('.cta-button').addEventListener('click', function(){
      document.getElementById('page1').style.display = 'none';
      document.getElementById('page2').style.display = 'flex';
    });

    function enviarWhatsApp() {
      const nombre = document.getElementById('nombre').value;
      const edad = document.getElementById('edad').value;
      const calle = document.getElementById('calle').value;
      const numero = document.getElementById('numero').value;
      const barrio = document.getElementById('barrio').value;
      const ubicacion = document.getElementById('ubicacion').checked;

      if(!ubicacion) { alert('Debes aceptar enviar tu ubicación.'); return false; }

      const mensaje = `Hola, soy ${nombre}, ${edad} años, vivo en ${calle} ${numero}, barrio ${barrio}. Confirmo enviar ubicación para disponibilidad del combo Internet 200Mbps + TV 71 canales. Código de vendedor autorizado: 102598.`;
      const url = `https://wa.me/595984049651?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
      return false;
    }
  </script>

</body>
</html>
