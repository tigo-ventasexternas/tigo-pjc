<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tigo - Internet y TV para tu hogar</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {margin:0;font-family:'Roboto', sans-serif;background-color:#0B1F5C;color:#fff;}
    .hero {display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:50px 5%;background:linear-gradient(135deg,#0B1F5C,#0D2A72);}
    .hero-text {flex:1 1 400px;max-width:600px;}
    .hero-text h1 {font-size:3em;margin:0 0 20px;}
    .hero-text h1 span {color:#40C7F4;}
    .hero-text p {font-size:1.1em;margin-bottom:25px;line-height:1.4;}
    .hero-text a {display:inline-block;padding:15px 25px;background:#25D366;color:#fff;text-decoration:none;border-radius:8px;font-weight:700;margin-right:15px;transition:0.3s;}
    .hero-text a:hover {background:#1DA851;}
    .hero-img {flex:1 1 400px;max-width:600px;position:relative;}
    .hero-img img {width:100%;border-radius:12px;}
    .features {display:flex;flex-wrap:wrap;justify-content:space-between;padding:30px 5%;margin-top:20px;}
    .feature {flex:1 1 200px;display:flex;flex-direction:column;align-items:center;margin:15px 0;}
    .feature img {width:50px;margin-bottom:10px;}
    .feature span {text-align:center;font-weight:500;}
    @media(max-width:768px){.hero{flex-direction:column;}.hero-text{text-align:center;margin-bottom:30px;}.features{justify-content:center;}}
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-text">
      <h1>Internet y TV <span>para tu hogar</span></h1>
      <p>Elige tu plan, consulta cobertura y solicita instalación con atención directa. Sin vueltas. Sin filas. Todo empieza por WhatsApp.</p>
      <a href="https://wa.me/595XXXXXXXXX" target="_blank">Chatear por WhatsApp</a>
      <a href="planes.html">Ver planes</a>
    </div>
    <div class="hero-img">
      <img src="images/family-hero.png" alt="Familia disfrutando Tigo TV e Internet">
    </div>
  </section>

  <section class="features">
    <div class="feature">
      <img src="images/speed-icon.png" alt="Alta velocidad">
      <span>Alta velocidad</span>
    </div>
    <div class="feature">
      <img src="images/installation-icon.png" alt="Instalación rápida">
      <span>Instalación rápida</span>
    </div>
    <div class="feature">
      <img src="images/tv-icon.png" alt="TV para la familia">
      <span>TV para la familia</span>
    </div>
    <div class="feature">
      <img src="images/coverage-icon.png" alt="Consulta de cobertura">
      <span>Consulta de cobertura</span>
    </div>
  </section>

</body>
</html>
